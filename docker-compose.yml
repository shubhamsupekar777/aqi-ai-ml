version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database Container
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: aqi-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aqi_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aqi_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # FastAPI Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aqi-ai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DEBUG=true
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aqi_ai}
      - SQLITE_FALLBACK_URL=sqlite:///./aqi_ai.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173
      - PREDICTION_MODE=demo
      - MODEL_DIR=app/ml/models
      - DEFAULT_STANDARD=epa
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__

  # ============================================================================
  # React + Vite Frontend Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aqi-ai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_DATA_MODE=api

volumes:
  postgres_data:
    driver: local
